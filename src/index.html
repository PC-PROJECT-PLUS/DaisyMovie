<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>DaisyMovie</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DaisyMovie – Il cinema, tutto tuo. Guarda film e serie in streaming.">
  <link rel="icon" type="image/png" href="assets/Logo_cropped.png">

  <!-- DNS prefetch + preconnect for Google Fonts (non-blocking) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Preload logo asset -->
  <link rel="preload" as="image" href="assets/Logo_cropped.png">
  <!-- All fonts load async — do NOT block rendering -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  </noscript>

  <!-- Inline CSS splash screen — visible INSTANTLY before any JS loads -->
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#08080f}

    /* Splash — shown while main.js downloads */
    #app-splash{
      position:fixed;inset:0;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:#08080f;
      z-index:99999;
      transition:opacity .45s ease, visibility .45s ease;
    }
    #app-splash.hide{opacity:0;visibility:hidden;pointer-events:none}

    /* Animated orb */
    .spl-orb{
      position:absolute;border-radius:50%;filter:blur(110px);pointer-events:none;
    }
    .spl-orb-1{
      width:480px;height:480px;
      background:radial-gradient(circle,rgba(99,60,180,.38),transparent 70%);
      top:-15%;left:-10%;
      animation:splOrb 10s ease-in-out infinite alternate;
    }
    .spl-orb-2{
      width:380px;height:380px;
      background:radial-gradient(circle,rgba(20,90,200,.28),transparent 70%);
      bottom:-12%;right:-8%;
      animation:splOrb 10s ease-in-out infinite alternate-reverse;
    }
    @keyframes splOrb{
      0%{transform:translate(0,0) scale(1)}
      100%{transform:translate(24px,-32px) scale(1.07)}
    }

    /* Logo + name */
    .spl-inner{
      position:relative;z-index:1;
      display:flex;flex-direction:column;align-items:center;gap:18px;
    }
    .spl-logo{
      width:64px;height:64px;object-fit:contain;
      filter:drop-shadow(0 0 20px rgba(160,100,255,.55));
      animation:splLogoPulse 2.4s ease-in-out infinite;
    }
    @keyframes splLogoPulse{
      0%,100%{filter:drop-shadow(0 0 16px rgba(160,100,255,.45))}
      50%{filter:drop-shadow(0 0 32px rgba(160,100,255,.75))}
    }
    .spl-name{
      font-family:system-ui,-apple-system,sans-serif;
      font-size:1.9rem;font-weight:800;letter-spacing:-.04em;color:#fff;
    }
    .spl-name span{
      background:linear-gradient(120deg,#a78bfa,#60a5fa);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text;
    }

    /* Pulsing dot loader */
    .spl-dots{display:flex;gap:8px;margin-top:8px}
    .spl-dot{
      width:7px;height:7px;border-radius:50%;
      background:rgba(167,139,250,.5);
      animation:splDot 1.2s ease-in-out infinite;
    }
    .spl-dot:nth-child(2){animation-delay:.2s}
    .spl-dot:nth-child(3){animation-delay:.4s}
    @keyframes splDot{
      0%,80%,100%{transform:scale(1);opacity:.5}
      40%{transform:scale(1.35);opacity:1;background:#a78bfa}
    }
  </style>
</head>
<body>
  <!-- Splash: visible immediately, before any JS -->
  <div id="app-splash" aria-hidden="true">
    <div class="spl-orb spl-orb-1"></div>
    <div class="spl-orb spl-orb-2"></div>
    <div class="spl-inner">
      <img class="spl-logo" src="assets/Logo_cropped.png" alt="DaisyMovie" width="64" height="64">
      <div class="spl-name">Daisy<span>Movie</span></div>
      <div class="spl-dots">
        <div class="spl-dot"></div>
        <div class="spl-dot"></div>
        <div class="spl-dot"></div>
      </div>
    </div>
  </div>

  <!-- Angular app mounts here -->
  <app-root></app-root>

  <!-- Hide splash once everything (JS, CSS, images, fonts) is loaded -->
  <script>
    (function(){
      var shown = Date.now();
      var MIN_MS = 600; // splash shows for at least 600ms
      var hidden = false;

      function hideSplash(){
        if(hidden) return;
        hidden = true;
        var el = document.getElementById('app-splash');
        if(el){ el.classList.add('hide'); }
      }

      // Wait for ALL resources (JS bundles, images, fonts) to finish
      function onLoad(){
        var elapsed = Date.now() - shown;
        var remaining = Math.max(0, MIN_MS - elapsed);
        setTimeout(hideSplash, remaining);
      }

      if(document.readyState === 'complete'){
        onLoad();
      } else {
        window.addEventListener('load', onLoad, { once: true });
      }

      // Absolute safety net — hide after 12s no matter what
      setTimeout(hideSplash, 12000);
    })();
  </script>
</body>
</html>
