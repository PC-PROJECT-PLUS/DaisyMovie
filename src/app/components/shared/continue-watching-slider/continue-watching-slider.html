<!-- SECTION 1: CONTINUE WATCHING -->
    <section class="content-section">
      <div class="section-header">
        <h2 class="section-title">Continua a guardare</h2>
        <div class="header-right-controls">
          <div class="section-scroll-arrows">
            <button class="section-arrow-btn glass-card" (click)="scrollSlider('continue-slider', 'left')"
              aria-label="Scroll left">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </button>
            <button class="section-arrow-btn glass-card" (click)="scrollSlider('continue-slider', 'right')"
              aria-label="Scroll right">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>
          <a href="javascript:void(0)" class="see-all-link">Vedi tutti &gt;</a>
        </div>
      </div>

      <div class="slider-wrapper" [class.has-fade-right]="canScrollRightContinue()"
        [class.has-fade-left]="canScrollLeftContinue()">

        <div class="continue-watching-slider" id="continue-slider" (scroll)="checkScrollState('continue-slider')">
          @for (item of continueWatchingList; track item.id) {
          <div class="continue-card glass-card">
            <div class="card-thumbnail-container">
              <img [src]="item.thumbnailUrl" [alt]="item.showTitle" class="thumbnail-img" />
              <div class="thumbnail-overlay"></div>

              <!-- Episode Air Date Overlay Top -->
              <div class="ep-info-badge">
                <span class="ep-title">{{ item.showTitle }}: {{ item.episodeTitle }}</span>
                <span class="air-date">In onda il: {{ item.airDate }}</span>
              </div>

              <!-- Floating Liquid Glass Video Control Bar -->
              <div class="liquid-player-bar glass-card">
                <button class="player-btn play-pause-btn" (click)="togglePlayState(item)">
                  @if (item.isPlaying) {
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="6" y="4" width="4" height="16"></rect>
                    <rect x="14" y="4" width="4" height="16"></rect>
                  </svg>
                  } @else {
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                  </svg>
                  }
                </button>

                <span class="player-time">{{ item.currentTime }}</span>

                <!-- Seek Bar Progress -->
                <div class="seek-bar-track">
                  <div class="seek-bar-fill" [style.width.%]="item.progressPercent"></div>
                  <div class="seek-bar-thumb" [style.left.%]="item.progressPercent"></div>
                </div>

                <span class="player-time total">{{ item.totalTime }}</span>

                <button class="player-btn icon-only" title="Audio">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                  </svg>
                </button>

                <button class="player-btn icon-only" title="Fullscreen">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <polyline points="9 21 3 21 3 15"></polyline>
                    <line x1="21" y1="3" x2="14" y2="10"></line>
                    <line x1="3" y1="21" x2="10" y2="14"></line>
                  </svg>
                </button>
              </div>
            </div>
          </div>
          }
        </div>
      </div>
    </section>
