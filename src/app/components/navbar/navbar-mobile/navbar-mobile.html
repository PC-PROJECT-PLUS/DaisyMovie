<nav class="navbar-mobile-container">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="nav-left" routerLink="/">
      <img src="assets/Logo_cropped.png" alt="Logo" width="34" height="34" style="object-fit: contain;" />
      <span class="logo-text" [style.width]="getLogoWidth()" style="transition: width 0.3s ease; display: inline-block; white-space: nowrap;">Daisy<span>{{ getLogoText() }}</span></span>
    </div>
    
    <div class="nav-right">
      <button class="icon-btn burger-btn" (click)="toggleMenu()">
        <svg *ngIf="!isMenuOpen()" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        <svg *ngIf="isMenuOpen()" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Expandable Menu -->
  <div class="menu-expandable-wrap" [class.expanded]="isMenuOpen()">
    <div class="menu-inner">
      
      <!-- Search Input in Menu -->
      <div class="menu-search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" placeholder="Cerca film, serie..." [(ngModel)]="searchQuery" (keydown.enter)="onSearchEnter()" />
        <button class="clear-btn" *ngIf="searchQuery()" (click)="searchQuery.set('')">X</button>
      </div>

      <div class="mn-divider"></div>

      <div class="menu-links">
        <a href="javascript:void(0)" [class.active]="categoryService.activeCategory() === 'Film'" (click)="setCategory('Film')">Film</a>
        <a href="javascript:void(0)" [class.active]="categoryService.activeCategory() === 'Serie TV'" (click)="setCategory('Serie TV')">Serie TV</a>
        <a href="javascript:void(0)" [class.active]="categoryService.activeCategory() === 'Animazione'" (click)="setCategory('Animazione')">Animazione</a>
        <a href="javascript:void(0)" [class.active]="categoryService.activeCategory() === 'Anime'" (click)="setCategory('Anime')">Anime</a>
      </div>

      <div class="mn-divider"></div>

      <!-- Footer: User, Notifications, Logout -->
      <div class="menu-footer">
        <div class="footer-user" routerLink="/settings" (click)="toggleMenu()" style="cursor: pointer;">
          <img src="https://i.pravatar.cc/150?img=68" alt="User" />
          <span class="user-name">Luca</span>
        </div>
        
        <div class="footer-actions">
          <button class="footer-btn" title="Cronologia" routerLink="/history" (click)="toggleMenu()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </button>
          <button class="footer-btn" title="Preferiti" routerLink="/favorites" (click)="toggleMenu()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
            </svg>
          </button>
          
          <button class="footer-btn" title="Notifiche">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </button>
          
          <button class="footer-btn logout-btn" title="Esci">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>

    </div>
  </div>
</nav>
