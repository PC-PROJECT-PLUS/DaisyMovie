<nav class="navbar-container">
  <!-- Left Side: Logo & Links -->
  <div class="nav-left">
    <div class="navbar-logo" routerLink="/">
      <div class="logo-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"
            fill="#000000" />
        </svg>
      </div>
      <span class="logo-name">Daisy<span>Movie</span></span>
    </div>

    <ul class="nav-links">
      @for (item of navItems; track item) {
      <li [class.active]="activeTab() === item" (click)="setActiveTab(item, $event)" class="nav-item">
        <a href="javascript:void(0)">{{ item }}</a>
      </li>
      }
      <div class="active-indicator" [style.left]="indicatorStyle().left" [style.width]="indicatorStyle().width"></div>
    </ul>
  </div>

  <!-- Right Side: Search, Notification Bell, User Pill -->
  <div class="nav-right">
    <!-- Expandable Search Bar -->
    <div class="search-box" [class.expanded]="isSearchExpanded()">
      <button class="search-btn" (click)="toggleSearch()" aria-label="Search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      <input type="text" class="search-input" placeholder="Titolo, Genere, Regista, Attore..." [value]="searchQuery()"
        (input)="searchQuery.set($any($event.target).value)" (focus)="onSearchFocus()" (blur)="onSearchBlur()" />
    </div>

    <!-- Notification Bell -->
    <button class="notification-btn" title="Notifiche">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
    </button>

    <!-- User Profile Pill & Hover Dropdown (From Hand-Drawn Sketch) -->
    <div class="user-wrapper" (mouseenter)="toggleUserMenu(true)" (mouseleave)="toggleUserMenu(false)">
      <div class="user-pill">
        <img class="user-avatar"
          src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80"
          alt="Alex Terrible" />
        <span class="user-name">Alex Terrible</span>
        <svg class="chevron-icon" [class.open]="isUserMenuOpen()" width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>

      <!-- Transparent Glass Hover Menu -->
      <div class="user-expandable-panel" [class.open]="isUserMenuOpen()">
        <ul class="dropdown-list">
          <li class="dropdown-option">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
            <span>Impostazioni</span>
          </li>
          <li class="dropdown-option">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
            </svg>
            <span>Mi piace</span>
          </li>
          <li class="dropdown-option logout">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            <span>Esci</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</nav>
